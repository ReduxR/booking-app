databaseChangeLog:
  - changeSet:
      id: add-roles-table
      author: ReduxR
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(70)
                  constraints:
                    unique: true
                    nullable: false
