services:
  db:
    image: postgres:18.6
    restart: on-failure:3
    
    ports:
      - "${POSTGRES_LOCAL_PORT}:${POSTGRES_DOCKER_PORT}"
    
    volumes:
      - postgres_data:/var/lib/postgresql
    
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      
volumes:
  postgres_data: